# armdeck: the whole ALSA configuration of what an ARMDeck Library tile starts (armdeck-run points
# ALSA_CONFIG_PATH here, so alsa.conf is not read). The only device is PipeWire's default output,
# "Speakers (protected)" (docs/hardware-safety.md 4.4), through the container's pipewire-alsa
# plugin (the PulseAudio one is not installed there). ALSA knows no hardware device here ("hw:0"
# does not exist), so an emulator that falls back to ALSA gets PipeWire, or silence if the plugin
# is missing, never the amplifiers directly. The container user can open /dev/snd (podman keeps
# the host's audio group), which is why the hardware devices must stay undefined.
pcm.!default {
	type pipewire
	playback_node "-1"
	capture_node "-1"
}
ctl.!default {
	type pipewire
}
