# armdeck: settings armdeck-run adds on top of RetroArch's own configuration at every start
# (--appendconfig), so they hold even if they are changed in RetroArch's menu.
# Sound through PipeWire (PulseAudio), never ALSA directly (docs/hardware-safety.md 4.4).
audio_driver = "pulse"
# the controller through SDL2 (Steam's virtual controller is mapped by SDL's database)
input_joypad_driver = "sdl2"
# the RetroArch menu during a game: L3 + R3 (both sticks pressed)
input_menu_toggle_gamepad_combo = "2"
