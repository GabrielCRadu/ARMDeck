# armdeck: Steam's sleep runs op8-standby instead of systemd-sleep (no kernel suspend; the reasons
# are in that script). ExecStopPost undoes a standby that ended without restoring (killed, stop
# timeout): the apps must never stay frozen, and /run/op8-standby.active must never stay behind.
# Installed at /etc/systemd/system/systemd-suspend.service.d/10-op8-standby.conf
[Service]
ExecStart=
ExecStart=/usr/local/bin/op8-standby
ExecStopPost=/usr/local/bin/op8-standby cleanup
