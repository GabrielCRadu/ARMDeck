# armdeck: a power-off that takes longer than 3 minutes is forced (systemd's own default is 30
# minutes). op8-lowbatt powers off at 3.25 V, where every minute of a stuck shutdown drains the
# battery further; its own "force it a minute later" cannot help, because the shutdown stops
# op8-lowbatt.service too. poweroff-force still kills the processes and unmounts the file
# systems, it only skips stopping the remaining units one by one.
# Installed at /etc/systemd/system/poweroff.target.d/armdeck-poweroff-timeout.conf
[Unit]
JobTimeoutSec=3min
JobTimeoutAction=poweroff-force
