# armdeck: keep kernel errors off the screen. With "quiet" the console still prints errors
# (level 3), so a harmless audio codec message ("wcd938x_codec: Impedance detect ramp error", see
# docs/lessons-learned.md, 2026-10-10) showed on the screen while Steam was starting. Only levels
# 0-2 (emergency, alert, critical) reach the screen now; every message stays in dmesg, the journal
# and the op8 boot reports. Applied by systemd-sysctl about 7 s into the boot.
kernel.printk = 3 4 1 7
