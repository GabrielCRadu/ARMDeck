# armdeck: MangoHud presets for the Steam performance overlay levels (Quick Access > Performance).
# Steam writes the chosen level as "preset=N" to the config file; MangoHud then reads the matching
# [preset N] section here (~/.config/MangoHud/presets.conf). Level 1 (FPS only) keeps MangoHud's
# default.
#
# Level 2 starts from MangoHud's own preset ("inherit") and adds what is missing: an option listed
# twice is drawn twice. Levels 3 and 4 list every element in display order instead: MangoHud's own
# presets 3 and 4 use the legacy layout, which ignores custom_text and exec (no battery temperature).
#
# Phone-specific choices:
# - CPU temperature from the prime core (cpu7_top_thermal), the hottest one in games. Without
#   this, MangoHud takes the first cpuN_thermal sensor, a cool little core.
# - GPU load, clock and temperature, battery percentage, power draw (W) and time left: need
#   mangoapp built with the patches in build-mangoapp-gs.sh.
# - Battery temperature: the value op8-thermal acts on (it starts limiting at 41 °C).
# - Levels 3 and 4 use one font size (no_small_font), so labels such as the battery
#   temperature and the resolution are as readable as the numbers.
# - No CPU/GPU power: the phone has no powercap or GPU power sensor, and asking for them only
#   fills the log with errors twice a second.
# - The battery temperature line uses only shell builtins (read, echo, arithmetic): MangoHud runs
#   exec= lines in its own long-lived shell every 500 ms, and an awk there was a new process each
#   time. The gauge reports tenths of a degree.

[preset 2]
inherit
cpu_power=0
gpu_power=0
cpu_temp
gpu_temp
gpu_core_clock
cpu_custom_temp_sensor=cpu7_top_thermal,temp1
custom_text=BAT TEMP
exec=read t < /sys/class/power_supply/bq27411-0/temp; s=; [ "$t" -lt 0 ] && s=- && t=$((-t)); echo "$s$((t / 10)).$((t % 10))C"

[preset 3]
legacy_layout=0
no_small_font
cpu_custom_temp_sensor=cpu7_top_thermal,temp1
fps
frame_timing
gpu_stats
gpu_temp
gpu_core_clock
cpu_stats
cpu_temp
cpu_mhz
ram
battery
battery_watt
battery_time
custom_text=Battery temp
exec=read t < /sys/class/power_supply/bq27411-0/temp; s=; [ "$t" -lt 0 ] && s=- && t=$((-t)); echo "$s$((t / 10)).$((t % 10)) C"

[preset 4]
legacy_layout=0
no_small_font
cpu_custom_temp_sensor=cpu7_top_thermal,temp1
fps
frametime
frame_timing
gpu_stats
gpu_temp
gpu_core_clock
cpu_stats
cpu_temp
cpu_mhz
core_load
ram
swap
battery
battery_watt
battery_time
custom_text=Battery temp
exec=read t < /sys/class/power_supply/bq27411-0/temp; s=; [ "$t" -lt 0 ] && s=- && t=$((-t)); echo "$s$((t / 10)).$((t % 10)) C"
resolution
