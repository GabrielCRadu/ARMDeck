# armdeck: a PulseAudio client's stream that gets no data for 5 s (an underrun) is paused, so the
# audio path (audio DSP, codec, speaker amplifiers) can switch off; it plays again as soon as the
# client sends data. Needed for standby: Steam starts a sound as it asks for sleep, op8-standby
# freezes it in the middle, and its open stream kept the whole audio path running at 94 Hz for
# the whole standby (2026-10-29, docs/lessons-learned.md). PipeWire's default is 0 (off); its own
# configuration uses the same 5 s for speech-dispatcher.
pulse.properties = {
    pulse.idle.timeout = 5
}
