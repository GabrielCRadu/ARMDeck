# steamed-noodle: iesirea ALSA directa spre difuzoare are numele de avertizare si prioritate mica,
# ca ieseasa implicita sa fie mereu "Difuzoare (protejat)". Volumul ei (plafonul) se seteaza o
# singura data cu wpctl si ramane salvat de WirePlumber.
monitor.alsa.rules = [
    {
        matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
        actions = {
            update-props = {
                node.description = "DIRECT - nu folosi (fara protectie)"
                priority.session = 100
                priority.driver  = 100
                # Ca aplay-ul care a mers pe 2026-10-01: 16 biti, fara MMAP, perioade mari.
                # Cu S24_LE + MMAP + perioade de 10 ms, q6asm-dai ruleaza dar difuzoarele tac.
                audio.format = "S16LE"
                api.alsa.disable-mmap = true
                api.alsa.period-size = 1024
                api.alsa.headroom = 1024
            }
        }
    }
]
