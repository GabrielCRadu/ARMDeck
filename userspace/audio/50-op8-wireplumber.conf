# armdeck: the direct ALSA output to the speakers gets a warning name and a low priority, so the
# default output is always "Speakers (protected)". Its volume (the ceiling) is set once with
# wpctl and WirePlumber keeps it.
monitor.alsa.rules = [
    {
        matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
        actions = {
            update-props = {
                node.description = "DIRECT - do not use (no protection)"
                priority.session = 100
                priority.driver  = 100
                # Like the aplay test that worked on 2026-10-01: 16 bit, no MMAP, large periods.
                # With S24_LE + MMAP + 10 ms periods, q6asm-dai runs but the speakers stay silent.
                audio.format = "S16LE"
                api.alsa.disable-mmap = true
                api.alsa.period-size = 1024
                api.alsa.headroom = 1024
            }
        }
    }
]
