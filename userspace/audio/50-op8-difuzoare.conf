# steamed-noodle: iesirea protejata pentru difuzoarele OnePlus 8 (2x NXP TFA9874, fara protectia
# de difuzor din driverul mainline). Lantul: aplicatii -> "Difuzoare (protejat)" (acest filtru:
# trece-sus 250 Hz + clamp la 0 dBFS) -> iesirea ALSA directa, al carei volum e PLAFONUL
# (-40 dB la primul test, apoi -30 dB, nivelul testat curat pe 2026-10-01).
# Slider-ul de volum din Steam controleaza filtrul, deci poate doar sa coboare sub plafon.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Difuzoare (protejat)"
            media.name       = "Difuzoare (protejat)"
            filter.graph = {
                nodes = [
                    { type = builtin name = hpL label = bq_highpass control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin name = hpR label = bq_highpass control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin name = cL  label = clamp       control = { "Min" = -1.0 "Max" = 1.0 } }
                    { type = builtin name = cR  label = clamp       control = { "Min" = -1.0 "Max" = 1.0 } }
                ]
                links = [
                    { output = "hpL:Out" input = "cL:In" }
                    { output = "hpR:Out" input = "cR:In" }
                ]
                inputs  = [ "hpL:In" "hpR:In" ]
                outputs = [ "cL:Out" "cR:Out" ]
            }
            capture.props = {
                node.name       = "op8_difuzoare_protejat"
                media.class     = "Audio/Sink"
                audio.position  = [ FL FR ]
                priority.session = 2000
                priority.driver  = 2000
            }
            playback.props = {
                node.name       = "op8_difuzoare_protejat.out"
                node.passive    = true
                audio.position  = [ FL FR ]
                target.object   = "alsa_output.platform-sound.HiFi__Speaker__sink"
                stream.dont-remix = true
            }
        }
    }
]
