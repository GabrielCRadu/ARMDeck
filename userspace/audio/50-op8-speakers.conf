# armdeck: the protected output for the OnePlus 8 speakers (2x NXP TFA9874, without the speaker
# protection the mainline driver lacks). The chain: applications -> "Speakers (protected)" (this
# filter) -> the direct ALSA output, whose volume is the CEILING for everything that goes through
# PipeWire (-30 dB tested clean on 2026-10-01, -24 dB and -18 dB from 2026-10-03; with the
# average-power limiter below, -15 dB and then -12 dB on 2026-10-06).
# The filter, per channel: 250 Hz high-pass (protects the small drivers from bass excursion),
# clamp at 0 dBFS, a slow RMS compressor (LSP Compressor Mono), then a fixed gain. FL is the top
# earpiece speaker, the smallest one: it gets 3 dB less than FR, the bottom speaker.
# The compressor is the average-power limiter docs/hardware-safety.md (4.4) asked for before any
# ceiling above -18 dB: above -9.6 dBFS RMS (averaged over 250 ms, 500 ms attack, 2 s release) it
# compresses 20:1, so a sustained full-scale signal comes out at about -9.3 dBFS RMS. With the
# ceiling at -12 dB that is -21.3 dB, no more average power than a full-scale tone (-3 dBFS RMS)
# got at the old -18 dB ceiling (-21 dB): at most about 89 mW on the bottom speaker and 45 mW on
# the top one (amplifier at its 5.6 W data sheet maximum). Ordinary sound, below that level, is
# 6 dB louder than at -18 dB; only short peaks above it pass the slow attack. Going further needs
# the speakers' real limits (OnePlus does not publish them).
# Needs pipewire-filter-graph-ladspa and lsp-plugins-ladspa.
# The Steam volume slider controls this filter's input, so it can only go below the ceiling.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers (protected)"
            media.name       = "Speakers (protected)"
            filter.graph = {
                nodes = [
                    { type = builtin name = hpL label = bq_highpass control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin name = hpR label = bq_highpass control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin name = cL  label = clamp       control = { "Min" = -1.0 "Max" = 1.0 } }
                    { type = builtin name = cR  label = clamp       control = { "Min" = -1.0 "Max" = 1.0 } }
                    # average-power limiter: RMS sidechain (mode 1), downward (mode 0), hard knee
                    # (1.0 = 0 dB), threshold 0.33 = -9.6 dBFS, no make-up gain, fully wet
                    { type = ladspa name = pL plugin = /usr/lib/ladspa/lsp-plugins-ladspa.so
                      label = "http://lsp-plug.in/plugins/ladspa/compressor_mono"
                      control = {
                          "Sidechain mode" = 1  "Sidechain reactivity (ms)" = 250.0
                          "Compression mode" = 0  "Attack threshold (G)" = 0.33
                          "Attack time (ms)" = 500.0  "Release time (ms)" = 2000.0
                          "Ratio" = 20.0  "Knee (G)" = 1.0  "Makeup gain (G)" = 1.0
                          "Dry gain (G)" = 0.0  "Wet gain (G)" = 1.0
                      } }
                    { type = ladspa name = pR plugin = /usr/lib/ladspa/lsp-plugins-ladspa.so
                      label = "http://lsp-plug.in/plugins/ladspa/compressor_mono"
                      control = {
                          "Sidechain mode" = 1  "Sidechain reactivity (ms)" = 250.0
                          "Compression mode" = 0  "Attack threshold (G)" = 0.33
                          "Attack time (ms)" = 500.0  "Release time (ms)" = 2000.0
                          "Ratio" = 20.0  "Knee (G)" = 1.0  "Makeup gain (G)" = 1.0
                          "Dry gain (G)" = 0.0  "Wet gain (G)" = 1.0
                      } }
                    # top speaker -3 dB (10^(-3/20) = 0.708), bottom speaker unchanged
                    { type = builtin name = gL  label = linear      control = { "Mult" = 0.708 } }
                    { type = builtin name = gR  label = linear      control = { "Mult" = 1.0 } }
                ]
                links = [
                    { output = "hpL:Out" input = "cL:In" }
                    { output = "hpR:Out" input = "cR:In" }
                    { output = "cL:Out"  input = "pL:Input" }
                    { output = "cR:Out"  input = "pR:Input" }
                    { output = "pL:Output" input = "gL:In" }
                    { output = "pR:Output" input = "gR:In" }
                ]
                inputs  = [ "hpL:In" "hpR:In" ]
                outputs = [ "gL:Out" "gR:Out" ]
            }
            capture.props = {
                node.name       = "op8_speakers_protected"
                media.class     = "Audio/Sink"
                audio.position  = [ FL FR ]
                priority.session = 2000
                priority.driver  = 2000
            }
            playback.props = {
                node.name       = "op8_speakers_protected.out"
                node.passive    = true
                audio.position  = [ FL FR ]
                target.object   = "alsa_output.platform-sound.HiFi__Speaker__sink"
                stream.dont-remix = true
            }
        }
    }
]
