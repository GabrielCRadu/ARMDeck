# armdeck: Bluetooth headphones only as an audio output (A2DP; LE Audio roles left as default).
# No Hands-Free (hfp_hf, hfp_ag): the kernel has no RFCOMM yet (CONFIG_BT_RFCOMM), so the
# Hands-Free profile can never connect, and while the phone advertises it, headphones such as
# the Galaxy Buds3 Pro try it first and fail. The headphones' microphone is not used.
# Goes to ~/.config/wireplumber/wireplumber.conf.d/, then: systemctl --user restart wireplumber
monitor.bluez.properties = {
    bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
}
