# op8-log (armdeck): journald drop-in. During the reset hunt the journal was synced to disk every
# 2 s (default 5 min) so an unexpected reset lost as little as possible. That cause is fixed
# (kernel patch 0003), and the 2 s sync woke the disk all the time, so it is off now. journald
# still syncs at once after messages of priority CRIT, ALERT or EMERG.
# To hunt resets again, uncomment the line and restart systemd-journald.
[Journal]
#SyncIntervalSec=2s
